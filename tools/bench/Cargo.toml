[package]
name = "bench"
build = "../../crates/vad/build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quatsch-mit-sosse-models = { path = "../../crates/models" }
quatsch-mit-sosse-stt = { path = "../../crates/stt" }
quatsch-mit-sosse-textfx = { path = "../../crates/textfx" }
hound = "3.5.1"
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data", "utf8_iter"] }
icu_properties = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
