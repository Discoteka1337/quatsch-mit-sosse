[package]
name = "quatsch-mit-sosse"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "quatsch-mit-sosse"

[lib]
name = "quatsch_mit_sosse_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
quatsch-mit-sosse-audio = { path = "../../crates/audio" }
quatsch-mit-sosse-hotkey = { path = "../../crates/hotkey" }
quatsch-mit-sosse-inject = { path = "../../crates/inject" }
quatsch-mit-sosse-models = { path = "../../crates/models" }
quatsch-mit-sosse-stt = { path = "../../crates/stt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri = { version = "~2.12.6", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
unicode-segmentation = "1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Globalization"] }
tauri = { version = "~2.12.6", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
