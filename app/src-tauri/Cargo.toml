[package]
name = "quatsch-mit-sosse"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "quatsch-mit-sosse"

[lib]
name = "quatsch_mit_sosse_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.12.6", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tauri = { version = "~2.12.6", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
