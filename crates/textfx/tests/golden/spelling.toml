expected = "im Hotel grosse Aussicht"

[[case]]
name = "Familienname und Versalien"
input = "Frau Gross und Herr Weiss schreiben GROSS"
rules = ["dictionary"]
expected = "Frau Gross und Herr Weiss schreiben GROSS"

[[case]]
name = "Keine Änderung am Bezeichner oder Dateinamen"
input = "gross.rs /schliessen anschliessend@example.org und meine_grosse_datei"
rules = ["dictionary"]
expected = "gross.rs /schliessen anschliessend@example.org und meine_grosse_datei"

[[case]]
name = "Nur ganze Wortformen"
