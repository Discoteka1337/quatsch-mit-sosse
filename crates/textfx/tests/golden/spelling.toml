[[case]]
name = "Langes o in gebeugten Adjektiven"
input = "die grosse und die grössere Tasche"
rules = ["dictionary"]
expected = "die große und die größere Tasche"

[[case]]
name = "Infinitiv und Vorsilbe"
input = "wir schliessen und verschliessen die Türen"
rules = ["dictionary"]
expected = "wir schließen und verschließen die Türen"

[[case]]
name = "Partizip nach trennbarer Vorsilbe"
input = "die anschliessende Sitzung"
rules = ["dictionary"]
expected = "die anschließende Sitzung"

[[case]]
name = "Satzanfang mit Adverb"
input = "Anschliessend gehen wir"
rules = ["dictionary"]
expected = "Anschließend gehen wir"

[[case]]
name = "Kurzvokale und mehrdeutige Schreibungen"
input = "Masse Busse Ross muss fassen wissen"
rules = ["dictionary"]
expected = "Masse Busse Ross muss fassen wissen"

[[case]]
name = "Geschützter Wörterbucheintrag"
input = "im Hotel grosse Aussicht"
rules = ["dictionary"]
