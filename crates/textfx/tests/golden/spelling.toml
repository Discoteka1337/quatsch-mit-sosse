input = "wir schliessen das Tor"
rules = []
expected = "wir schliessen das Tor"

[[case]]
name = "Bestehende deutsche Schreibung ist stabil"
input = "große Ziele sind einschließlich Anhang erfasst"
rules = ["dictionary"]
expected = "große Ziele sind einschließlich Anhang erfasst"

[[case]]
name = "Vorsilbe aus bleibt vor dem Wortstamm intakt"
input = "Ausschliesslich aktuelle Angebote ausschliessen"
