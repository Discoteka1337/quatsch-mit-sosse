[[case]]
name = "Nach einem geschützten Namen beginnt ein neuer Satz"
input = "wir sehen iTeam. dann gehen wir"
rules = ["punctuation"]
proper_names = ["iTeam"]
expected = "Wir sehen iTeam. Dann gehen wir."

[[case]]
name = "Satz mit zwei zitierten Begriffen"
input = "„ja“ bedeutet „einverstanden“"
